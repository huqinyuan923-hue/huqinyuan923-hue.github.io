<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="12%" r="68%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".34"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="12%" cy="88%" r="60%">
      <stop offset="0" stop-color="#fb7185" stop-opacity=".26"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="80" y="166" font-size="20" font-weight="600" letter-spacing="3" fill="#22d3ee">NAND2TETRIS · 软件轨审计</text>
    <text x="80" y="268" font-size="66" font-weight="800" fill="#f1f5f9">看不见的栈泄漏</text>
    <text x="82" y="330" font-size="28" fill="#cbd5e1">一个 void 调用，每次吃掉一个字</text>
    <text x="82" y="414" font-size="21" fill="#94a3b8">16 项发现 · 14 项修复 · 7/7 门级对拍</text>
    <text x="82" y="454" font-size="21" fill="#94a3b8">71/71 测试 · ROM 32768 字的天花板</text>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="760" y="72" font-size="15" letter-spacing="1.5" fill="#94a3b8">调用栈（向上生长）</text>

    <rect x="760" y="92" width="320" height="56" rx="10" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".40"/>
    <text x="780" y="126" font-size="16" fill="#cbd5e1">返回地址 / 旧帧</text>

    <rect x="760" y="164" width="320" height="56" rx="10" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".40"/>
    <text x="780" y="198" font-size="16" fill="#cbd5e1">LCL · ARG · THIS · THAT</text>

    <rect x="760" y="236" width="320" height="56" rx="10" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".40"/>
    <text x="780" y="270" font-size="16" fill="#cbd5e1">locals</text>

    <rect x="760" y="308" width="320" height="56" rx="10" fill="#fb7185" fill-opacity=".10" stroke="#fb7185" stroke-opacity=".70" stroke-dasharray="7 6"/>
    <text x="780" y="342" font-size="16" fill="#fecdd3">void 的返回槽（没人弹）</text>

    <path d="M900 382 L900 456" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
    <path d="M891 446 L900 458 L909 446" stroke="#fb7185" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="862" y="392" width="76" height="26" rx="6" fill="#fb7185" fill-opacity=".16" stroke="#fb7185" stroke-opacity=".45"/>
    <text x="900" y="410" font-size="14" text-anchor="middle" fill="#fecdd3">+1 字</text>

    <rect x="760" y="470" width="320" height="54" rx="10" fill="#f59e0b" fill-opacity=".08" stroke="#f59e0b" stroke-opacity=".40"/>
    <text x="780" y="503" font-size="16" fill="#fcd34d">heap（2048 起）</text>

    <path d="M1110 350 L1110 210" stroke="#22d3ee" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M1101 222 L1110 208 L1119 222" stroke="#22d3ee" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1162" y="300" font-size="14" fill="#67e8f9" transform="rotate(90 1162 300)">SP 每次 +1</text>
  </g>

  <g fill="none" stroke="#22d3ee" stroke-opacity=".16" stroke-width="1.5">
    <circle cx="1090" cy="120" r="150"/>
    <circle cx="1090" cy="120" r="210"/>
  </g>
</svg>
