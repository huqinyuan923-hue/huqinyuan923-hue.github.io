name: CI

on:
  pull_request:
  # deploy.yml 只管「能不能发出去」，类型/守卫单测/E2E 只有 CI 跑；main 是唯一发布分支，
  # 之前 branches-ignore: [main] 让这些检查在真正上线的代码上一次都没跑过。CI 红不挡发布。
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # next-contentlayer2 只在 next build 里生成 .contentlayer，而 typecheck/单测排在
      # 构建之前，拿不到 contentlayer/generated 就整片 TS2307——CI 一直红在这一 step，
      # 后面的构建、E2E、Lighthouse 全部 skipped。
      - name: Generate Contentlayer types
        run: npx contentlayer2 build

      - name: Lint
        run: npx next lint --dir pages --dir app --dir components --dir lib --dir layouts --dir scripts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: pnpm test

      # 与 deploy.yml 同步：output: 'export' 不允许 route handler，/api/npm 会在
      # "Collecting page data" 阶段直接报错，必须先把 app/api 挪走。
      - name: Disable API routes (not supported in static export)
        run: mv app/api api.disabled

      - name: Build static site
        env:
          EXPORT: 'true'
          BASE_PATH: ''
          UNOPTIMIZED: 'true'
          INIT_CWD: ${{ github.workspace }}
          NEXT_PUBLIC_STATIC_EXPORT: 'true'
        run: pnpm build

      # postbuild 生成 RSS / 标签订阅写进 public/，发生在 next build 拷贝静态资源之后
      - name: Copy post-build assets into out
        run: cp -r public/. out/

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Lighthouse CI (mobile budget)
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || true)"
          if [ -z "$CHROME_BIN" ]; then
            CHROME_BIN="$(find "$HOME/.cache/ms-playwright" -type f -name chrome | head -n 1)"
          fi
          CHROME_PATH="$CHROME_BIN" pnpm perf
